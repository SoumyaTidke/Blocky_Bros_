<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cowboy Game</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <div id="mini"></div>
  <div id="banner"></div>

  <div id="touch">
    <button class="pause-btn" data-action="pause" aria-label="Pause">II</button>
    <div class="pad pad-left">
      <button data-action="left" aria-label="Left">&#9664;</button>
      <button data-action="right" aria-label="Right">&#9654;</button>
    </div>
    <div class="pad pad-right">
      <button data-action="run" aria-label="Run">RUN</button>
      <div class="stack">
        <button data-action="shoot" aria-label="Shoot">SHOOT</button>
        <button data-action="jump" aria-label="Jump">JUMP</button>
      </div>
    </div>
  </div>

  <div id="rotate">Please rotate your device to landscape</div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
